include ./mocha.conf
font_family        jetbrains mono nerd font
font_size          13
bold_font          auto
italic_font        auto
bold_italic_font   auto
mouse_hide_wait    1.0
cursor_shape       block
url_style          dotted
background_opacity 1.0

# Close the terminal without confirmation
confirm_os_window_close 0

# BEGIN_KITTY_THEME
# Duskfox
include current-theme.conf
# END_KITTY_THEME

# Управление цветом курсора из скрипта Hyprland через локальный сокет.
allow_remote_control socket-only
listen_on unix:${XDG_RUNTIME_DIR}/kitty-layout

# Удобство чтения и работы с выводом
window_padding_width 6
scrollback_lines 20000
strip_trailing_spaces smart

# Поиск: в открывшемся less нажмите /, введите текст и Enter.
# Заменяет стандартное Ctrl+Shift+F для перестановки внутренних окон kitty.
map --allow-fallback=shifted,ascii ctrl+shift+f show_scrollback

# Копирование слова с экрана: наберите появившуюся метку.
map --allow-fallback=shifted,ascii ctrl+shift+y kitten hints --type word --program @

# Новая вкладка рядом с текущей, в том же каталоге.
map --allow-fallback=shifted,ascii ctrl+shift+t launch --type=tab --cwd=current --location=after

# Чёткие границы вкладок; панель появляется при двух вкладках.
tab_bar_style powerline
tab_bar_min_tabs 2
